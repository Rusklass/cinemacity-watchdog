name: Cinema City watchdog

# Checks Cinema City schedule and opens a GitHub issue when new Dune IMAX
# screenings are scheduled (GitHub will send email and mobile push notifications).
#
# Runs 4 times per hour. Public repositories have unlimited Actions minutes.
# Extra runs cost nothing and break nothing — alerting is driven by changes
# compared to state/seen.json.
on:
  schedule:
    - cron: "8,21,38,51 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Report all matching screenings, even known ones"
        type: boolean
        default: false
      test_notification:
        description: "Send initial/startup test notification to verify Telegram and NTFY"
        type: boolean
        default: true

# State is committed back to the repo — prevent concurrent runs from overwriting commits.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check schedule
        id: watch
        # Customize film pattern, auditorium, or minimum free seat ratio here:
        env:
          FILM_PATTERN: dun
          AUDITORIUM_PATTERN: imax
          MIN_AVAILABILITY_RATIO: ${{ vars.MIN_AVAILABILITY_RATIO || '0.05' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 watch.py \
            --state state/seen.json \
            --report report.md \
            --title title.txt \
            ${{ inputs.force_report && '--force-report' || '' }} \
            ${{ inputs.test_notification && '--test-notification' || '' }}

      - name: Create issue for new screenings
        if: steps.watch.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assigning to the repository owner is key: GitHub sends email and push
          # notifications by default only for "Participating" events.
          url=$(gh issue create \
            --title "$(cat title.txt)" \
            --body-file report.md \
            --assignee "${{ github.repository_owner }}")
          echo "Created: $url"
          # Close issue immediately — it serves only as a delivery notification channel.
          gh issue close "$url" --reason completed

      - name: Save state back to repository
        run: |
          rm -f report.md title.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- state/seen.json; then
            git add state/seen.json
            git commit -m "Update schedule state ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep 5
            done
            echo "::error::Failed to push state."
            exit 1
          fi

          # Prevent GitHub Actions from suspending the scheduled workflow due to inactivity (60-day limit).
          # If the last commit is older than 30 days, update state/.keepalive to keep schedule active.
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          DAYS_SINCE_COMMIT=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          if [ "$DAYS_SINCE_COMMIT" -ge 30 ]; then
            echo "Last commit was $DAYS_SINCE_COMMIT days ago. Updating keepalive commit to prevent schedule suspension."
            date -u '+%Y-%m-%d %H:%M UTC' > state/.keepalive
            git add state/.keepalive
            git commit -m "Keepalive: prevent schedule suspension ($(date -u '+%Y-%m-%d'))"
            for i in 1 2 3; do
              git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep 5
            done
            echo "::error::Failed to push keepalive commit."
            exit 1
          fi

          echo "State unchanged, nothing to commit."
          exit 0

